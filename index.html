<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      maximum-scale/user-scalable are deliberately NOT locked: PRD section 10
      forbids disabling page-level accessibility zoom. While a drawing is
      open, CSS sets touch-action and overscroll-behavior on html and body
      so the page does not scroll under a stroke. That does not cancel
      Android system gestures. See D-57.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2933" />
    <meta name="description" content="Learn to draw, one step at a time, on a tablet." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" id="drawsprout-manifest" href="/manifest-en.webmanifest" />
    <title>DrawSprout — Learn to Draw</title>
    <script src="/locale-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
